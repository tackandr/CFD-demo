[project]
name = "cfd-demo"
version = "0.1.0"
description = "Two-dimensional compressible Euler solver using nodal discontinuous Galerkin methods in JAX."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.12",
    "numpy>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfd_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "verification: verification benchmark from an ADR (runs by default; slow)",
]
